# ai-dev-sandbox — php-mysql preset defaults.
# Any key not set in the project's sandbox.conf falls back to these.

PHP_VERSION=8.4
PHP_MEMORY_LIMIT=128M
# Claude Code 2.1.198+ needs Node >=22; on 20, npm silently installs an old Claude.
NODE_VERSION=22
MYSQL_VERSION=8.4
TZ=UTC
HTTP_PORT=8080
DOCROOT=public
DB_NAME=db
DB_PASSWORD=root
HOST_CLAUDE_MD=yes

# Generated directories kept off the bind mount, one per line.
# Paths are relative to the project root.
SANDBOX_VOLUMES="
vendor
node_modules
"
